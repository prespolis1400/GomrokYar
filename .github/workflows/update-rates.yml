name: Update Customs Exchange Rates

on:
  schedule:
    # اجرا هر ۶ ساعت یک‌بار (قابل تغییر)
    - cron: '0 */6 * * *'
  workflow_dispatch: # امکان اجرای دستی از تب Actions

permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Scraper
        run: node scrape.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update exchange rates [skip ci]" && git push)
